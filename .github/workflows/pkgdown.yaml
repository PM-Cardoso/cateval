on:
  push:
    branches: [main, master, R-package]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

# Permissions required for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build the pkgdown site and upload it as a Pages artifact.
  build:
    # Pinned rather than ubuntu-latest: the Ubuntu 26.04 image hung on apt
    # downloads (DNS failures) in November 2026. Move back to ubuntu-latest
    # once that image is reliable.
    runs-on: ubuntu-24.04
    # A normal build takes 2-4 minutes; fail fast instead of hanging for hours.
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Deploy the artifact to GitHub Pages (push events only).
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
