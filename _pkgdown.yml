url: https://PM-Cardoso.github.io/cateval/

template:
  bootstrap: 5
  bslib:
    primary: "#1d4ed8"
    secondary: "#52514e"
    body-color: "#1f2328"
    base_font:
      google: {family: "Inter", wght: [400, 500, 600, 700]}
    heading_font:
      google: {family: "Inter", wght: [600, 700]}
    code_font:
      google: {family: "JetBrains Mono", wght: [400, 500]}
    font-size-base: "1rem"
    headings-font-weight: 600
    border-radius: "0.5rem"
    link-decoration: none

repo:
  url:
    home: https://github.com/PM-Cardoso/cateval
    source: https://github.com/PM-Cardoso/cateval/blob/main/
    issue: https://github.com/PM-Cardoso/cateval/issues/

home:
  title: "cateval: check whether a treatment-selection model gives the right advice"
  description: >
    Validate the predicted treatment benefit from treatment-selection models
    with a continuous outcome: overall benefit from matched patients, and
    pairwise treatment effects.

footer:
  structure:
    left: developed_by
    right: built_with

navbar:
  bg: dark
  type: dark
  structure:
    left:  [example, reference, news]
    right: [search, github]
  components:
    example:
      text: Worked example
      href: articles/worked-example.html
    github:
      icon: fab fa-github
      href: https://github.com/PM-Cardoso/cateval
      aria-label: GitHub

articles:
  - title: Articles
    navbar: ~
    contents:
      - "articles/worked-example"

reference:
  - title: "Overall benefit"
    desc: >
      Pair patients who received the recommended treatment with similar
      patients who did not, then compare predicted and observed benefit.
    contents:
      - match_benefit_pairs
      - benefit_overall
      - benefit_by_group
      - benefit_citl_slope
      - benefit_by_drug
  - title: "Pairwise calibration"
    desc: >
      Compare predicted and observed differences between each pair of
      treatments.
    contents:
      - pairwise_calibration
      - pairwise_calibration_pair
  - title: "Recommended treatments"
    desc: >
      Find the recommended treatment, or the set of near-best treatments, for
      each patient and summarise them.
    contents:
      - get_best_drugs
      - get_ranked_or_tolerant_drugs
      - plot_optimal_drugs
  - title: "Example data"
    contents:
      - cateval_example
